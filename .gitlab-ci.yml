#variables:
#  PATH: "C:\\OpenSSH;C:\\Program Files\\Git\\bin;C:\\Program Files\\dotnet"
  
stages:
  - build

build_job:
  stage: build
  only:
    - branches
  script:      
    - dotnet clean .\GamesAdmin\GamesAdmin.sln
    - dotnet restore .\GamesAdmin\GamesAdmin.sln
    - dotnet build .\GamesAdmin\GamesAdmin.sln
    - dotnet publish -c Local .\GamesAdmin\src\GamesAdmin.Api\GamesAdmin.Api.csproj -o ./build/dotnet/l1/game-admin-api
    - dotnet publish -c Local .\GamesAdmin\src\GamesAdmin.Site\GamesAdmin.Site.csproj -o ./build/dotnet/l1/game-admin-site
tags:
    - deploy-dotnet
  artifacts:
    expire_in: 2 days
    paths:
      - './build/dotnet/l1/game-admin-api'
      - './build/dotnet/l1/game-admin-api'
