deploy_game_admin_api:
  stage: deploy-game-admin-api
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:   
    - echo "====== Deploying ... ======"
    - dotnet publish -c Local ./GamesAdmin/src/GamesAdmin.Api/GamesAdmin.Api.csproj -o ./build/game-admin-api
    - tar -C ./build/game-admin-api/ -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/game-admin-api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-game-admin-api restart'
  artifacts:
    expire_in: 2 days
    paths:
      - './build/game-admin-api'
  tags:
    - deploy-dotnet
  environment:
    name: LOCAL
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/
    
deploy_game_admin_api_SIT:
  stage: deploy-game-admin-api
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  script:   
    - echo "====== Deploying ... ======"
    - git clone git@gitlab.com:l1-compiled/game-admin-api-compiled.git ./build/game-admin-api/sit
    - dotnet publish -c SIT ./GamesAdmin/src/GamesAdmin.Api/GamesAdmin.Api.csproj -o ./build/game-admin-api/sit
    - cd ./build/game-admin-api/sit
    - git add .
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing change"; else git commit -m "$COMMIT_MESSAGE"; fi
    - git push -u origin master
  tags:
    - deploy-dotnet
  environment:
    name: SIT
 # only:
 #   - /^deploy-\d{8}-\d+.*$/
 #   - /^deploy-api-\d{8}-\d+.*$/
    
