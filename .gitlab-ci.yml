variables:
  NUGET_PATH: 'C:\Tools\Nuget\nuget.exe'
  MSBUILD_PATH: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\MSBuild\Current\Bin\msbuild.exe'

stages:
  - build

build_job:
  stage: build
  only:
    - branches
  script:  
    - echo "Restoring NuGet Packages..."
    - '"$env:MSBUILD_PATH" /t:Restore .\GamesAdmin\src\GamesAdmin.Api\GamesAdmin.Api.csproj'
    - echo "Building project..."
    - '"$env:MSBUILD_PATH" /t:Build .\GamesAdmin\src\GamesAdmin.Api\GamesAdmin.Api.csproj'
  artifacts:
    expire_in: 2 days
    paths:
      - '.\GamesAdmin\src\GamesAdmin.Api\bin\Debug\'
