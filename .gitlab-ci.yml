variables:
  PATH: "C:\\OpenSSH;C:\\Program Files\\Git\\bin;C:\\Program Files\\dotnet"
  
stages:
  - build

build_job:
  stage: build
  only:
    - branches
  script:      
    - dotnet clean .\GamesAdmin\GamesAdmin.sln
    - dotnet restore .\GamesAdmin\GamesAdmin.sln
    - dotnet build .\GamesAdmin\GamesAdmin.sln
    - dotnet publish -c Local .\GamesAdmin\src\GamesAdmin.Api\GamesAdmin.Api.csproj -o D:\games-admin-publish\api
    - dotnet publish -c Local .\GamesAdmin\src\GamesAdmin.Site\GamesAdmin.Site.csproj -o D:\games-admin-publish\site
    - scp -r -P 2201 D:\games-admin-publish\api\* root@35.194.253.55:/var/www/l1/game-admin-api
    - scp -r -P 2201 D:\games-admin-publish\site\* root@35.194.253.55:/var/www/l1/game-admin-site
    - ssh -p 2201 root@35.194.253.55 sudo service l1-game-admin-api restart
    - ssh -p 2201 root@35.194.253.55 sudo service l1-game-admin-site restart
  artifacts:
    expire_in: 2 days
    paths:
      - 'D:\games-admin-publish\api'
      - 'D:\games-admin-publish\site'
