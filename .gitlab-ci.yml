#variables:
#  PATH: "C:\\OpenSSH;C:\\Program Files\\Git\\bin;C:\\Program Files\\dotnet"
  
stages:
  - build
  - deploy-game-admin-api
  - deploy-game-admin-site

build:
  stage: build
  script:      
    - dotnet clean ./GamesAdmin/GamesAdmin.sln
    - dotnet restore ./GamesAdmin/GamesAdmin.sln
    - dotnet build ./GamesAdmin/GamesAdmin.sln
  tags:
    - deploy-dotnet
    
deploy_game_admin_api:
  stage: deploy-game-admin-api
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:   
    - echo "====== Deploying ... ======"
    - dotnet publish -c Local ./GamesAdmin/src/GamesAdmin.Api/GamesAdmin.Api.csproj -o ./build/game-admin-api
    - tar -C ./build/game-admin-api -cvf game-admin-api.tar | ssh root@124.158.13.228 "cd /var/www/l1/game-admin-api && tar xvzf -"
  artifacts:
    expire_in: 2 days
    paths:
      - './build/game-admin-api'
  tags:
    - deploy-dotnet
    
deploy_game_admin_site:
  stage: deploy-game-admin-site
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:      
    - echo "====== Deploying ... ======"
    - dotnet publish -c Local ./GamesAdmin/src/GamesAdmin.Site/GamesAdmin.Site.csproj -o ./build/game-admin-site
    - tar -C ./build/game-admin-site -cvf game-admin-site.tar | ssh root@124.158.13.228 "cd /var/www/l1/game-admin-site && tar xvzf -"
  artifacts:
    expire_in: 2 days
    paths:
      - './build/game-admin-site'
  tags:
    - deploy-dotnet
