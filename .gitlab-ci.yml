stages:
  - build

build_job:
  stage: build
  only:
    - branches
  script:      
    - dotnet restore .\GamesAdmin\GamesAdmin.sln
    - dotnet build .\GamesAdmin\GamesAdmin.sln
    - dotnet publish --self-contained .\GamesAdmin\src\GamesAdmin.Api\GamesAdmin.Api.csproj
  artifacts:
    expire_in: 2 days
    paths:
      - '.\GamesAdmin\src\GamesAdmin.Api\bin\Debug\'
