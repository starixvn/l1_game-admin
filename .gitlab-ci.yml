variables:
  SCP_PATH: 'C:\Tools\pscp.exe'
  
stages:
  - build

build_job:
  stage: build
  only:
    - branches
  script:      
    - dotnet clean .\GamesAdmin\GamesAdmin.sln
    - dotnet restore .\GamesAdmin\GamesAdmin.sln
    - dotnet build .\GamesAdmin\GamesAdmin.sln
    - dotnet publish .\GamesAdmin\src\GamesAdmin.Api\GamesAdmin.Api.csproj -o D:\games-admin-publish\api
    - dotnet publish .\GamesAdmin\src\GamesAdmin.Site\GamesAdmin.Site.csproj -o D:\games-admin-publish\site
  artifacts:
    expire_in: 2 days
    paths:
      - 'D:\games-admin-publish\api'
      - 'D:\games-admin-publish\site'
