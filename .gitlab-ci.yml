#variables:
#  PATH: "C:\\OpenSSH;C:\\Program Files\\Git\\bin;C:\\Program Files\\dotnet"
  
stages:
  - build
  - deploy-game-admin-api
  - deploy-game-admin-site

build:
  stage: build
  script:      
    - dotnet clean ./GamesAdmin/GamesAdmin.sln
    - dotnet restore ./GamesAdmin/GamesAdmin.sln
    - dotnet build ./GamesAdmin/GamesAdmin.sln
  tags:
    - deploy-dotnet
    
deploy_game_admin_api:
  stage: deploy-game-admin-api
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:   
    - echo "====== Deploying ... ======"
    - dotnet publish -c Local ./GamesAdmin/src/GamesAdmin.Api/GamesAdmin.Api.csproj -o ./build/game-admin-api
    - tar -C ./build/game-admin-api/ -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/game-admin-api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-game-admin-api restart'
  artifacts:
    expire_in: 2 days
    paths:
      - './build/game-admin-api'
  tags:
    - deploy-dotnet
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/
    
deploy_game_admin_site:
  stage: deploy-game-admin-site
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$TARGET_SERVER_SECRET_KEY_BASE64" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:      
    - echo "====== Deploying ... ======"
    - dotnet publish -c Local ./GamesAdmin/src/GamesAdmin.Site/GamesAdmin.Site.csproj -o ./build/game-admin-site
    - tar -C ./build/game-admin-site/ -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/game-admin-site/ -jxf -'
    - ssh root@$HOST 'sudo service l1-game-admin-site restart'
  artifacts:
    expire_in: 2 days
    paths:
      - './build/game-admin-site'
  tags:
    - deploy-dotnet
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-site\d{8}-\d+.*$/
