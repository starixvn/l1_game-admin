variables:
  ADMIN_SITE_GIT_COMPILED: git@gitlab.com:l1-compiled/game-admin-site-compiled.git
  ADMIN_SITE_ROOT_PATH: ./GamesAdmin/src/GamesAdmin.Site
  ADMIN_SITE_BUILD_PATH: ./build/game-admin-site
  ADMIN_SITE_PROJECT_NAME: GamesAdmin.Site.csproj

.admin-site-push-git-compiled:
  script: 
    - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
      then
        export GIT_BRANCH=master;
      else
        export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
      fi
    - echo $GIT_BRANCH
    - echo "====== Pushing git compiled ... ======"
    - git clone --branch $GIT_BRANCH $ADMIN_SITE_GIT_COMPILED $ADMIN_SITE_BUILD_PATH
    - dotnet publish -c $CI_ENVIRONMENT_NAME -r linux-x64 --self-contained false $ADMIN_SITE_ROOT_PATH/$ADMIN_SITE_PROJECT_NAME -o $ADMIN_SITE_BUILD_PATH
    - cp $ADMIN_SITE_ROOT_PATH/gitlab-ci-after-script-${CI_ENVIRONMENT_NAME}.sh $ADMIN_SITE_BUILD_PATH
    - cd $ADMIN_SITE_BUILD_PATH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin $GIT_BRANCH;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi

.base-admin-site:
  stage: deploy
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - forward_deployment_failure
      - archived_failure

build:game-admin-site:
  stage: build
  script:   
    - dotnet clean $ADMIN_SITE_ROOT_PATH/$ADMIN_SITE_PROJECT_NAME
    - dotnet restore $ADMIN_SITE_ROOT_PATH/$ADMIN_SITE_PROJECT_NAME
    - dotnet build $ADMIN_SITE_ROOT_PATH/$ADMIN_SITE_PROJECT_NAME
  tags:
    - docker
  only:
    - master
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-site-\d{8}-\d+.*$/
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-site-\d{8}-\d+.*$/
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-site-\d{8}-\d+.*$/
    - /^deploy-uat-\d{8}-\d+.*$/
    - /^deploy-uat-site-\d{8}-\d+.*$/

local_deploy:game_admin_site:
  extends: 
    - .base-admin-site
  script:
    - apt-get update
    - apt-get --assume-yes install build-essential 
    - echo "====== Deploying ... ======"
    - dotnet publish -c Local $ADMIN_SITE_ROOT_PATH/$ADMIN_SITE_PROJECT_NAME -o $ADMIN_SITE_BUILD_PATH
    - tar -C $ADMIN_SITE_BUILD_PATH -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/game-admin-site/ -jxf -'
    - ssh root@$HOST 'sudo service l1-game-admin-site restart'
  environment:
    name: LOCAL
  needs:
    - build:game-admin-site
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-site-\d{8}-\d+.*$/
    - /^deploy-local-site-\d{8}-\d+.*$/

sit_deploy:game_admin_site:
  extends: 
    - .base-admin-site
    - .admin-site-push-git-compiled
  environment:
    name: SIT
  needs:
    - build:game-admin-site
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-site-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-site-\d{8}-\d+.*$/

uat_deploy:game_admin_site:
  extends: 
    - .base-admin-site
    - .admin-site-push-git-compiled
  environment:
    name: UAT
  needs:
    - build:game-admin-site
  only:
    - /^deploy-uat-\d{8}-\d+.*$/
    - /^deploy-uat-site-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-site-\d{8}-\d+.*$/

prod_deploy:game_admin_site:
  extends: 
    - .base-admin-site
    - .admin-site-push-git-compiled
  environment:
    name: PRO
  needs:
    - build:game-admin-site
  when: manual
  allow_failure: false
  only:
    - master
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-site-\d{8}-\d+.*$/

