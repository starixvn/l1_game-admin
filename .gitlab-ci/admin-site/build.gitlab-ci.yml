.build-admin-site:
  variables:
    PROJECT_PATH: ./GamesAdmin/src/GamesAdmin.Site
    BUILD_PATH: ~/build/game-admin-site
    PROJECT_NAME: GamesAdmin.Site.csproj
    ADMIN_SITE_CLIENT_ROOT_PATH: ./GamesAdmin/src/game-admin-client
  script:
    - npm run export --prefix $ADMIN_SITE_CLIENT_ROOT_PATH
    - dotnet clean $PROJECT_PATH/$PROJECT_NAME
    - dotnet publish -c $DEPLOY_ENV -r linux-x64 --self-contained false $PROJECT_PATH/$PROJECT_NAME -o $BUILD_PATH
