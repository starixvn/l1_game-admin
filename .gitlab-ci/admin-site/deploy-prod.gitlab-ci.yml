post_build_admin_site_prod:
  extends:
    - .deploy_vars_admin_site
    - .post_build
    - .deploy:prod-auto:rules
  needs: ['build_image_admin_site']
  environment:
    name: PROD

deploy_admin_site_prod:
  extends:
    - .deploy_vars_admin_site
    - .base_deploy_kbt
    - .deploy:prod:rules
  needs: ['post_build_admin_site_prod']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_PROD
    SERVER_USER: $SC_SWARM_LEADER_PROD_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_PROD_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_PROD
    SWARM_REPLICAS: 1
    NODE_LABEL: L1_API
    DOCKER_PUBLIC_PORT: 8301
    DOCKER_PRIVATE_PORT: 8301
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: PROD
