build_image_admin_site_prod:
  extends:
    - .deploy_vars
    - .build_image
    - .deploy:prod-auto:rules
  # needs: ['build_admin_site_prod']
  # dependencies:
  #   - build_admin_site_prod
  environment:
    name: PROD

post_build_admin_site_prod:
  extends:
    - .deploy_vars
    - .post_build
    - .deploy:prod-auto:rules
  needs: ['build_image_admin_site_prod']
  environment:
    name: PROD

deploy_admin_site_prod:
  extends:
    - .deploy_vars
    - .base_deploy_kbt
    - .deploy:prod:rules
  needs: ['post_build_admin_site_prod']
  variables:
    SERVER_IP: $PROD_IP
    SERVER_USER: $PROD_USER
    SERVER_PORT: $PROD_SSH_PORT
    DOCKER_PUBLIC_PORT: 8301
    DOCKER_PRIVATE_PORT: 8301
  environment:
    name: PROD
