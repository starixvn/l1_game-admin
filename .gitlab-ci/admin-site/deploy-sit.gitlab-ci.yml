build_image_admin_site_sit:
  extends:
    - .deploy_vars_admin_site
    - .build_image
    - .deploy-site:sit:rules
  environment:
    name: SIT

post_build_admin_site_sit:
  extends:
    - .deploy_vars_admin_site
    - .post_build
    - .deploy-site:sit:rules
  needs: ['build_image_admin_site_sit']
  environment:
    name: SIT

deploy_admin_site_sit:
  extends:
    - .deploy_vars_admin_site
    - .base_deploy_kbt
    - .deploy-site:sit:rules
  needs: ['post_build_admin_site_sit']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 6501
    DOCKER_PRIVATE_PORT: 6501
  environment:
    name: SIT
