.if-deploy-all: &if-deploy-all
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-site-\d{8}-\d+.*$/'

.if-deploy-local: &if-deploy-local
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-\d{8}-\d+.*$/'

.if-deploy-site-local: &if-deploy-site-local
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-site-\d{8}-\d+.*$/'

# .if-deploy-sit: &if-deploy-sit
#   if: '$CI_COMMIT_TAG =~ /^l1-deploy-sit-\d{8}-\d+.*$/'

# .if-deploy-site-sit: &if-deploy-sit
#   if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-sit-\d{8}-\d+.*$/'

# .if-deploy-uat: &if-deploy-uat
#   if: '$CI_COMMIT_TAG =~ /^l1-deploy-uat-\d{8}-\d+.*$/'

# .if-deploy-site-uat: &if-deploy-uat
#   if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-uat-\d{8}-\d+.*$/'
.deploy:local:rules:
  rules:
    - <<: *if-deploy-local
      when: on_success
    - <<: *if-deploy-site-local
      when: on_success
    - <<: *if-deploy-all
      when: on_success
    - when: never
