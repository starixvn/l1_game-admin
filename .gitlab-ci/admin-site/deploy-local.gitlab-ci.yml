build_image_admin_site_local:
  extends:
    - .deploy_vars_admin_site
    - .build_image
    - .deploy-site:local:rules
  environment:
    name: LOCAL

post_build_admin_site_local:
  extends:
    - .deploy_vars_admin_site
    - .post_build
    - .deploy-site:local:rules
  needs: ['build_image_admin_site_local']
  environment:
    name: LOCAL

deploy_admin_site_local:
  extends:
    - .deploy_vars_admin_site
    - .base_deploy_swarm_service
    - .deploy-site:local:rules
  needs: ['post_build_admin_site_local']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_LOCAL
    SERVER_USER: $SC_SWARM_LEADER_LOCAL_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_LOCAL_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_LOCAL
    SWARM_REPLICAS: 1
    NODE_LABEL: L2
    DOCKER_PUBLIC_PORT: 9103
    DOCKER_PRIVATE_PORT: 9103
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: LOCAL
