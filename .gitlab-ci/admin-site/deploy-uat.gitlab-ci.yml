build_image_admin_site_uat:
  extends:
    - .deploy_vars_admin_site
    - .build_image
    - .deploy-site:uat:rules
  environment:
    name: UAT

post_build_admin_site_uat:
  extends:
    - .deploy_vars_admin_site
    - .post_build
    - .deploy-site:uat:rules
  needs: ['build_image_admin_site_uat']
  environment:
    name: UAT

deploy_admin_site_uat:
  extends:
    - .deploy_vars_admin_site
    - .base_deploy_swarm_service
    - .deploy-site:sit:rules
  needs: ['post_build_admin_site_sit']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_SIT
    SERVER_USER: $SC_SWARM_LEADER_SIT_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_SIT_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_SIT
    SWARM_REPLICAS: 1
    NODE_LABEL: L2
    DOCKER_PUBLIC_PORT: 7311
    DOCKER_PRIVATE_PORT: 7311
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: UAT
