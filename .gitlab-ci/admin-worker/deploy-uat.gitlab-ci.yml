build_image_admin_worker_uat:
  extends:
    - .deploy_vars_admin_worker
    - .build_image
    - .deploy-worker:uat:rules
  environment:
    name: UAT

post_build_admin_worker_uat:
  extends:
    - .deploy_vars_admin_worker
    - .post_build
    - .deploy-worker:uat:rules
  needs: ['build_image_admin_worker_uat']
  environment:
    name: UAT

deploy_admin_worker_uat:
  extends:
    - .deploy_vars_admin_worker
    - .base_deploy_kbt
    - .deploy-worker:uat:rules
  needs: ['post_build_admin_worker_uat']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
  environment:
    name: UAT
