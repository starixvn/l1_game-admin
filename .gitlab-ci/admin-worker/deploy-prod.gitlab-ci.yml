post_build_admin_worker_prod:
  extends:
    - .deploy_vars_admin_worker
    - .post_build
    - .deploy:prod-auto:rules
  needs: ['build_image_admin_worker']
  environment:
    name: PROD

deploy_admin_worker_prod:
  extends:
    - .deploy_vars_admin_worker
    - .base_deploy_kbt
    - .deploy:prod:rules
  needs: ['post_build_admin_worker_prod']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_PROD
    SERVER_USER: $SC_SWARM_LEADER_PROD_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_PROD_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_PROD
    SWARM_REPLICAS: 1
    NODE_LABEL: L1_API
  environment:
    name: PROD
