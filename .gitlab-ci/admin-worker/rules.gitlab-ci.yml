.if-deploy-all: &if-deploy-all
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/'

.if-deploy-local: &if-deploy-local
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-\d{8}-\d+.*$/'

.if-deploy-sit: &if-deploy-sit
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-sit-\d{8}-\d+.*$/'

.if-deploy-uat: &if-deploy-uat
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-uat-\d{8}-\d+.*$/'

.if-deploy-all-api: &if-deploy-all-api
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-api-\d{8}-\d+.*$/'

.if-deploy-api-local: &if-deploy-api-local
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-local-api-\d{8}-\d+.*$/'

.if-deploy-api-sit: &if-deploy-api-sit
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-sit-api-\d{8}-\d+.*$/'

.if-deploy-api-uat: &if-deploy-api-uat
  if: '$CI_COMMIT_TAG =~ /^l1-deploy-uat-api-\d{8}-\d+.*$/'

.deploy-api:local:rules:
  rules:
    - <<: *if-deploy-local
      when: on_success
    - <<: *if-deploy-api-local
      when: on_success
    - <<: *if-deploy-all-api
      when: on_success
    - <<: *if-deploy-all
      when: on_success
    - when: never

.deploy-api:sit:rules:
  rules:
    - <<: *if-deploy-sit
      when: on_success
    - <<: *if-deploy-api-sit
      when: on_success
    - <<: *if-deploy-all-api
      when: on_success
    - <<: *if-deploy-all
      when: on_success
    - when: never

.deploy-api:uat:rules:
  rules:
    - <<: *if-deploy-uat
      when: on_success
    - <<: *if-deploy-api-uat
      when: on_success
    - <<: *if-deploy-all-api
      when: on_success
    - <<: *if-deploy-all
      when: on_success
    - when: never
