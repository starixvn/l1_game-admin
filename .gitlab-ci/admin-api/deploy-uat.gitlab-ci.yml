build_image_admin_api_uat:
  extends:
    - .deploy_vars_admin_api
    - .build_image
    - .deploy-api:uat:rules
  environment:
    name: UAT

post_build_admin_api_uat:
  extends:
    - .deploy_vars_admin_api
    - .post_build
    - .deploy-api:uat:rules
  needs: ['build_image_admin_api_uat']
  environment:
    name: UAT

deploy_admin_api_uat:
  extends:
    - .deploy_vars_admin_api
    - .base_deploy_kbt
    - .deploy-api:uat:rules
  needs: ['post_build_admin_api_uat']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 7504
    DOCKER_PRIVATE_PORT: 7504
  environment:
    name: UAT
