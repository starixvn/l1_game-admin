post_build_admin_api_prod:
  extends:
    - .deploy_vars_admin_api
    - .post_build
    - .deploy:prod-auto:rules
  needs: ['build_image_admin_api']
  environment:
    name: PROD

deploy_admin_api_prod:
  extends:
    - .deploy_vars_admin_api
    - .base_deploy_swarm_service
    - .deploy:prod:rules
  needs: ['post_build_admin_api_prod']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_PROD
    SERVER_USER: $SC_SWARM_LEADER_PROD_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_PROD_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_PROD
    SWARM_REPLICAS: 1
    NODE_LABEL: L2_API
    DOCKER_PUBLIC_PORT: 8314
    DOCKER_PRIVATE_PORT: 8314
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: PROD
