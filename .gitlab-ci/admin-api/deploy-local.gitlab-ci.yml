build_image_admin_api_local:
  extends:
    - .deploy_vars_admin_api
    - .build_image
    - .deploy-api:local:rules
  environment:
    name: LOCAL

post_build_admin_api_local:
  extends:
    - .deploy_vars_admin_api
    - .post_build
    - .deploy-api:local:rules
  needs: ['build_image_admin_api_local']
  environment:
    name: LOCAL

deploy_admin_api_local:
  extends:
    - .deploy_vars_admin_api
    - .base_deploy_local
    - .deploy-api:local:rules
  needs: ['post_build_admin_api_local']
  variables:
    SERVER_IP: $LOCAL_IP
    SERVER_USER: $LOCAL_USER
    SERVER_PORT: $LOCAL_SSH_PORT
    DOCKER_PUBLIC_PORT: 7778
    DOCKER_PRIVATE_PORT: 7778
  environment:
    name: LOCAL
