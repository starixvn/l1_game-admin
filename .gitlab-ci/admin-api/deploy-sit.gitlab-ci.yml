post_build_admin_api_sit:
  extends:
    - .deploy_vars_admin_api
    - .post_build
    - .deploy-api:sit:rules
  needs: ['build_image_admin_api']
  environment:
    name: SIT

deploy_admin_api_sit:
  extends:
    - .deploy_vars_admin_api
    - .base_deploy_swarm_service
    - .deploy-api:sit:rules
  needs: ['post_build_admin_api_sit']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_SIT
    SERVER_USER: $SC_SWARM_LEADER_SIT_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_SIT_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_SIT
    SWARM_REPLICAS: 1
    NODE_LABEL: L2
    DOCKER_PUBLIC_PORT: 6314
    DOCKER_PRIVATE_PORT: 6314
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: SIT
