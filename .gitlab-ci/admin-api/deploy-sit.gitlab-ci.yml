build_image_admin_api_sit:
  extends:
    - .deploy_vars_admin_api
    - .build_image
    - .deploy-api:sit:rules
  environment:
    name: SIT

post_build_admin_api_sit:
  extends:
    - .deploy_vars_admin_api
    - .post_build
    - .deploy-api:sit:rules
  needs: ['build_image_admin_api_sit']
  environment:
    name: SIT

deploy_admin_api_sit:
  extends:
    - .deploy_vars_admin_api
    - .base_deploy_kbt
    - .deploy-api:sit:rules
  needs: ['post_build_admin_api_sit']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 6514
    DOCKER_PRIVATE_PORT: 6514
  environment:
    name: SIT
